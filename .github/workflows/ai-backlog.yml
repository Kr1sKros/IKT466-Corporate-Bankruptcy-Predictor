name: AI backlog

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number (blank selects the oldest eligible issue)'
        required: false
        type: string
  schedule:
    - cron: '17 * * * *'

permissions: {}
concurrency:
  group: ai-backlog
  cancel-in-progress: false

jobs:
  select:
    if: github.event_name != 'issues' || github.event.label.name == 'ai-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      number: ${{ steps.select.outputs.number }}
      base: ${{ steps.select.outputs.base }}
      branch: ${{ steps.select.outputs.branch }}
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: select
        env:
          REQUESTED: ${{ inputs.issue_number }}
        with:
          script: |
            const repo = context.repo;
            if (context.eventName !== 'schedule') {
              const {data} = await github.rest.repos.getCollaboratorPermissionLevel({...repo, username: context.actor});
              if (!['admin','maintain','write'].includes(data.permission)) throw new Error('Write access required');
            }
            const requested = process.env.REQUESTED || (context.eventName === 'issues' ? String(context.payload.issue.number) : '');
            if (requested && !/^[1-9][0-9]*$/.test(requested)) throw new Error('Invalid issue number');
            const issues = requested
              ? [(await github.rest.issues.get({...repo, issue_number: Number(requested)})).data]
              : await github.paginate(github.rest.issues.listForRepo, {...repo, state:'open', labels:'ai-ready', sort:'created', direction:'asc', per_page:100});
            for (const issue of issues) {
              if (issue.pull_request || issue.state !== 'open' || !issue.labels.some(l => l.name === 'ai-ready') || issue.labels.some(l => l.name === 'ai-blocked')) continue;
              const branch = `ai/issue-${issue.number}`;
              try { await github.rest.git.getRef({...repo, ref:`heads/${branch}`}); continue; }
              catch (e) { if (e.status !== 404) throw e; }
              const {data: ref} = await github.rest.git.getRef({...repo, ref:`heads/${context.payload.repository.default_branch}`});
              core.setOutput('number', issue.number);
              core.setOutput('base', ref.object.sha);
              core.setOutput('branch', branch);
              break;
            }

  generate:
    needs: select
    if: needs.select.outputs.number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.select.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          ISSUE_NUMBER: ${{ needs.select.outputs.number }}
        with:
          script: |
            const {data} = await github.rest.issues.get({...context.repo, issue_number:Number(process.env.ISSUE_NUMBER)});
            if (data.state !== 'open' || !data.labels.some(l => l.name === 'ai-ready') || data.labels.some(l => l.name === 'ai-blocked')) throw new Error('Issue no longer eligible');
            const strip = s => (s || '').replace(/<!--[\s\S]*?-->/g, '').replace(/[\u200B-\u200F\u202A-\u202E\u2060-\u206F\uFEFF]/g, '');
            const task = JSON.stringify({number:data.number, title:strip(data.title), body:strip(data.body)});
            if (task.length > 20000) throw new Error('Issue too large; reduce it first');
            require('fs').writeFileSync('/tmp/backlog-issue.json', task);
      - name: Implement issue (last code-executing step)
        uses: openai/codex-action@1d82a3dba7c7988ec71ecae1ed5b8e8db96495c5 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/backlog/prompt.md
          sandbox: workspace-write
          safety-strategy: drop-sudo
      # Only this fixed artifact uploader runs after Codex; no shell or project code.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proposed-patch
          path: /tmp/backlog-result/change.patch
          if-no-files-found: error
          retention-days: 3

  verify:
    needs: [select, generate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.select.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: proposed-patch
          path: /tmp/proposed
      - run: python .github/backlog/validate_patch.py /tmp/proposed/change.patch
      - run: python -m pip install -e .
      - run: python -m pytest --junitxml=/tmp/pytest.xml
      - name: Require actual passing tests
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = ET.parse('/tmp/pytest.xml').getroot().iter('testsuite')
          passed = sum(int(s.get('tests', 0)) - int(s.get('skipped', 0)) - int(s.get('failures', 0)) - int(s.get('errors', 0)) for s in suites)
          assert passed > 0, 'No tests actually passed; skipped placeholders are insufficient'
          PY

  publish:
    needs: [select, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.select.outputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: proposed-patch
          path: /tmp/proposed
      - name: Revalidate and commit without running project code
        env:
          BRANCH: ${{ needs.select.outputs.branch }}
        run: |
          python .github/backlog/validate_patch.py /tmp/proposed/change.patch
          git switch -c "$BRANCH"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c core.hooksPath=/dev/null commit -m 'Implement ai-ready issue'
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          ISSUE_NUMBER: ${{ needs.select.outputs.number }}
          BASE_SHA: ${{ needs.select.outputs.base }}
          BRANCH: ${{ needs.select.outputs.branch }}
        with:
          script: |
            const repo = context.repo;
            const issue_number = Number(process.env.ISSUE_NUMBER);
            const {data: issue} = await github.rest.issues.get({...repo, issue_number});
            if (issue.state !== 'open' || !issue.labels.some(l => l.name === 'ai-ready') || issue.labels.some(l => l.name === 'ai-blocked')) throw new Error('Issue no longer eligible');
            const base = context.payload.repository.default_branch;
            const {data: ref} = await github.rest.git.getRef({...repo, ref:`heads/${base}`});
            if (ref.object.sha !== process.env.BASE_SHA) throw new Error('Default branch changed; rerun against current base');
            const auth = 'AUTHORIZATION: basic ' + Buffer.from('x-access-token:' + github.token).toString('base64');
            core.setSecret(auth);
            await exec.exec('git', ['-c', `http.https://github.com/.extraheader=${auth}`, 'push', 'origin', `HEAD:refs/heads/${process.env.BRANCH}`], {silent:true});
            const {data: pr} = await github.rest.pulls.create({...repo, head:process.env.BRANCH, base, draft:true,
              title:`AI: implement issue #${issue_number}`,
              body:`Closes #${issue_number}\n\nAI-generated proposal. Independent pytest verification passed, including at least one non-skipped test.\n\nReview correctness, test coverage, and research assumptions before marking ready and merging.\n\nRun: ${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`});
            await github.rest.issues.createComment({...repo, issue_number, body:`Draft PR ready for human review: ${pr.html_url}`});

  report_failure:
    needs: [select, generate, verify, publish]
    if: always() && needs.select.outputs.number != '' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          ISSUE_NUMBER: ${{ needs.select.outputs.number }}
        with:
          script: |
            const issue_number = Number(process.env.ISSUE_NUMBER);
            await github.rest.issues.addLabels({...context.repo, issue_number, labels:['ai-blocked']});
            await github.rest.issues.createComment({...context.repo, issue_number, body:`Agent stopped without completing publication. Review the run, clarify the task or resolve the failure, then remove ai-blocked to retry. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
