# XGBoost has a runnable search; null settings for other models remain planning choices.
random_seed: 42

dataset:
  handle: utkarshx27/american-companies-bankruptcy-prediction-dataset
  path: data/raw/american_bankruptcy.csv  # Downloader uses KaggleHub cache instead.
  kaggle_version: 3
  sha256: cff2c899a97ecd629415cb22f59186000e74e1c0a78cfae036c0a53025419b5e  # Audited in #44.
  company_column: company_name
  year_column: year
  label_column: status_label
  # Target (#45, README section 11): one observation per company at its last
  # recorded year t; 1 if status_label == failed, else 0 (validation.anchor_targets).
  # Intended meaning: Chapter 7/11 filing in t+1 (publisher convention).
  target_definition: company_status_at_last_recorded_year
  target_positive_label: failed
  label_granularity: company  # status_label repeats in every year of a company.
  # Not verifiable from the CSV: filing dates are absent and alive companies'
  # t+1 is unobserved. Timing rests on publisher documentation.
  target_verified: false
  feature_dictionary: validation.FEATURE_DICTIONARY  # Kaggle v3 names, checked by accounting identities.
  audit:
    issues: [44, 45]
    report: results/metrics/data_audit.json

# The protocol is declared in study_plan and docs/study-design.md. Inputs for
# both conditions are implemented (#48-#51; five-year scope #16); #53-#56, #60/#62/#70 must implement
# the runners before the experiments run.
study_plan:
  models: [logistic_regression, xgboost, mlp, gru]
  input_conditions: [latest_year, five_year]
  configuration_count: 8
  five_year_window: 5  # Latest five recorded years up to t; older records excluded.
  shared_company_split: true
  tuning:
    framework: optuna
    sampler: TPESampler
    sampler_seed: 42
    direction: maximize
    objective: validation_average_precision
    attempted_trials_per_study: 20  # Initial pilot budget, identical across studies.
    n_jobs: 1
    pruning: none
    separate_study_per_model_and_condition: true
    tune_class_weights: true
  internal_finish_date: '2026-11-22'

# Input representation (#48-#51, src/sequences.py, README section 12).
inputs:
  anchor: latest_company_year
  conditions: [latest_year, five_year]
  latest_year: x1_to_x18_at_anchor  # No length or temporal fields added.
  five_year:
    records: latest_five_up_to_anchor  # All of them if fewer than five; older ones dropped.
    window: 5  # = study_plan.five_year_window. May span >5 calendar years with gaps.
    missing_year_policy: skip_gaps  # Gaps visible through the offset.
    temporal_input: years_before_anchor  # t - year; 0 at t.
    gru:
      order: oldest_to_newest  # Last real step is always t.
      padding: zeros_after_real_steps_and_pack  # pack_padded_sequence.
    tabular:
      layout: recency_aligned_slots  # Record at t is always slot r0.
      slot_fields: [X1-X18, years_before_anchor, present]
      empty_slot_value: 0  # With present = 0; set after scaling (#46).
  evaluation_cohort: all_companies  # Every company in both conditions.

split:
  strategy: company_grouped_stratified
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15
  stratify_by: [target, history_group]  # history_group: recorded years 1, 2, 3, 4, 5+.
  allow_company_overlap: false
  directory: data/splits  # Gitignored; created by scripts/prepare_data.py.
  # Checksums of the files from seed 42; prepare_data.py and load_splits fail
  # if a regenerated split differs.
  sha256:
    train: 22acdda6dcc0ddf4eb4970f330ee3da0c4e6a83f7953a7c71d40226a314ea8e6
    validation: f7e793099162a55f24a82fdec0bca4a60da5c6ffeae93ac7d4865bfba02d5eb2
    test: f4c9307d3ca500e6cb617a063f6b7d546b13cfcbc93504c00bc265d6c4bdc5fa

preprocessing:
  missing_value_strategy: error  # Audited financial cells are complete; no imputation.
  scaling_strategy: standard  # Fixed; never selected by Optuna.
  fit_population:  # Separate scaler per condition, fitted on the rows it uses.
    latest_year: training_company_final_year
    five_year: training_company_last_five_records
  reuse_across_input_conditions: false
  model_scaling:
    logistic_regression: standard
    xgboost: identity
    mlp: standard
    gru: standard
  relative_offsets: unchanged
  padding: zero_after_transform
  fit_on_training_only: true

models:
  logistic_regression:
    solver: lbfgs
    regularization: L2
    max_iter: 5000  # Fixed convergence cap, not an Optuna parameter.
    tol: 0.0001
    search:
      C_low: 0.0001
      C_high: 10000.0
      positive_class_weight: log_1_to_training_ratio
  xgboost:
    # Identical space in both conditions; class-weight bounds use training labels.
    search:
      n_estimators: {low: 100, high: 400}
      max_depth: {low: 2, high: 6}
      learning_rate: {low: 0.02, high: 0.2, log: true}
      min_child_weight: {low: 1.0, high: 10.0, log: true}
      subsample: {low: 0.7, high: 1.0}
      colsample_bytree: {low: 0.7, high: 1.0}
      reg_lambda: {low: 0.1, high: 10.0, log: true}
      reg_alpha: {low: 0.0, high: 1.0}
  mlp:
    hidden_sizes: null
  gru:
    # Optuna search space (#55); identical for latest_year and five_year.
    search_space:
      hidden_size: [16, 32, 64, 128, 256]
      num_layers: [1, 2, 3]
      dropout: [0.0, 0.5]  # Before the head; also between GRU layers when num_layers > 1.
      learning_rate: [1.0e-4, 1.0e-2]  # Log scale.
      weight_decay: [1.0e-6, 1.0e-3]  # Log scale.
      pos_weight: [1.0, train_negative_to_positive_ratio]  # Log scale; leakage.class_weight_bounds.
      batch_size: [128, 256, 512]
    head: dropout_linear  # Hidden state at t -> dropout -> Linear(hidden, 1) -> logit.

# Shared neural training rules (MLP and GRU); lr/batch size come from Optuna.
training:
  optimizer: adam
  max_epochs: 200
  early_stopping_patience: 20  # Epochs without a better validation AP.
  selection_metric: validation_average_precision  # Unweighted.
  restore_best_checkpoint: true

evaluation:
  main_metric: average_precision  # Chosen PR-AUC summary; document convention.
  additional_metrics: [precision, recall, f1, accuracy, roc_auc, confusion_matrix]
  decision_threshold: null  # Select on validation data only.
  threshold_rule: max_f1_highest_threshold_on_tie
  identical_test_companies: true
  error_analysis: [missed_bankruptcies, false_alarms]

outputs:
  processed_data: data/processed
  splits: data/splits
  figures: results/figures
  metrics: results/metrics
  models: results/models
