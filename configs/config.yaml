# Planning template only. Null settings require agreement before experiments.
random_seed: 42

dataset:
  handle: utkarshx27/american-companies-bankruptcy-prediction-dataset
  path: data/raw/american_bankruptcy.csv  # Downloader uses KaggleHub cache instead.
  kaggle_version: 3
  sha256: cff2c899a97ecd629415cb22f59186000e74e1c0a78cfae036c0a53025419b5e  # Audited in #44.
  company_column: company_name
  year_column: year
  label_column: status_label
  # Target (#45, README section 11): one observation per company at its last
  # recorded year t; 1 if status_label == failed, else 0 (validation.anchor_targets).
  # Intended meaning: Chapter 7/11 filing in t+1 (publisher convention).
  target_definition: company_status_at_last_recorded_year
  target_positive_label: failed
  label_granularity: company  # status_label repeats in every year of a company.
  # Not verifiable from the CSV: filing dates are absent and alive companies'
  # t+1 is unobserved. Timing rests on publisher documentation.
  target_verified: false
  feature_dictionary: validation.FEATURE_DICTIONARY  # Kaggle v3 names, checked by accounting identities.
  audit:
    issues: [44, 45]
    report: results/metrics/data_audit.json

# Current runner/history API settings below are retained for compatibility.
# The new protocol is declared in study_plan and docs/study-design.md; #48–#51,
# #53–#56, #60/#62/#70 must extend the implementation before its experiments run.
study_plan:
  models: [logistic_regression, xgboost, mlp, gru]
  input_conditions: [latest_year, full_history]
  configuration_count: 8
  full_history_capacity: 20  # Declared dataset schema span, 1999–2018; never truncate.
  shared_company_split: true
  tuning:
    framework: optuna
    sampler: TPESampler
    sampler_seed: 42
    direction: maximize
    objective: validation_average_precision
    attempted_trials_per_study: 20  # Initial pilot budget, identical across studies.
    n_jobs: 1
    pruning: none
    separate_study_per_model_and_condition: true
    tune_class_weights: true
  internal_finish_date: '2026-11-22'

inputs:
  baseline_models: [logistic_regression, xgboost, mlp]
  baseline_years: 1
  anchor: latest_company_year
  gru_lookback_windows: [1, 2, 3, 4, 5]  # Existing API only; not the revised study matrix.
  # GRU histories (#49-#51, README section 12):
  window_selection: last_k_recorded_years  # Backwards from anchor t.
  gru_year_order: oldest_to_newest  # Last real step is always t.
  missing_year_policy: skip_gaps  # Calendar gaps are not filled.
  short_history_policy: pad_end_and_pack  # Zero-pad after real steps; pack_padded_sequence.
  evaluation_cohorts:
    main: all_companies
    sub_analysis: at_least_k_years

split:
  strategy: company_grouped_stratified
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15
  stratify_by: [target, history_group]  # history_group: recorded years 1, 2, 3, 4, 5+.
  allow_company_overlap: false
  directory: data/splits  # Gitignored; created by scripts/prepare_data.py.
  # Checksums of the files from seed 42; prepare_data.py and load_splits fail
  # if a regenerated split differs.
  sha256:
    train: 22acdda6dcc0ddf4eb4970f330ee3da0c4e6a83f7953a7c71d40226a314ea8e6
    validation: f7e793099162a55f24a82fdec0bca4a60da5c6ffeae93ac7d4865bfba02d5eb2
    test: f4c9307d3ca500e6cb617a063f6b7d546b13cfcbc93504c00bc265d6c4bdc5fa

preprocessing:
  missing_value_strategy: null
  scaling_strategy: null
  fit_on_training_only: true

models:
  logistic_regression:
    C: null
    max_iter: null
    class_weight: null
  xgboost:
    n_estimators: null
    max_depth: null
    learning_rate: null
    scale_pos_weight: null
  mlp:
    hidden_sizes: null
  gru:
    hidden_size: null
    num_layers: null

training:
  epochs: null
  batch_size: null
  learning_rate: null
  early_stopping_patience: null

evaluation:
  main_metric: average_precision  # Chosen PR-AUC summary; document convention.
  additional_metrics: [precision, recall, f1, accuracy, roc_auc, confusion_matrix]
  decision_threshold: null  # Select on validation data only.
  identical_test_companies: true
  error_analysis: [missed_bankruptcies, false_alarms]

outputs:
  processed_data: data/processed
  splits: data/splits
  figures: results/figures
  metrics: results/metrics
  models: results/models
